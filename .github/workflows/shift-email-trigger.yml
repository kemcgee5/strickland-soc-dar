name: Trigger daily shift email check

# Runs every 15 minutes, all day, every day -- for free, with no Vercel
# plan requirement. It calls the deployed API endpoint, which itself does
# nothing at all unless it's currently ~8am America/New_York (DST-safe,
# checked in real time inside the function) -- so this just knocks on the
# door every 15 minutes and the function decides whether today's report(s)
# are due to send.
#
# GitHub Actions' schedule trigger isn't guaranteed to the minute either
# (a few minutes of slop is normal, more under high platform load), same
# general idea as Vercel's own Cron Jobs -- fine here since the function
# is idempotent (a shift already marked "sent" is never re-sent).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you manually run this from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-shift-emails endpoint
        run: |
          curl -sS -X POST "https://YOUR-VERCEL-PROJECT.vercel.app/api/send-shift-emails" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
